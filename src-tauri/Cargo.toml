[package]
name = "scheduler"
version = "1.0.0"
description = "SCHEDULER desktop schedule widget"
authors = ["SCHEDULER"]
edition = "2021"

[lib]
name = "scheduler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "SCHEDULER"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
